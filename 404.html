<style>
/* ==========================================================
   SISTEMA
   Escala tipográfica: razão 1.25 (terça maior), fluida.
   Escala de espaço: base 8px, progressão 1 · 2 · 3 · 5 · 8 · 13 · 21.
   Grade: 12 colunas, calha 24px, largura máxima 1280px.
   Cor: preto, branco, terracota. Terracota = ativo.
   ========================================================== */
:root{
  --preto:#000; --branco:#FFF; --terracota:#C04430;

  --display:"Playfair","Playfair Display",Georgia,serif;
  --corpo:"Jost","Futura","Century Gothic",Helvetica,Arial,sans-serif;

  /* tipo */
  --t-1: clamp(0.8125rem, 0.78rem + 0.15vw, 0.875rem);
  --t0:  clamp(1rem,      0.95rem + 0.25vw, 1.125rem);
  --t1:  clamp(1.25rem,   1.15rem + 0.5vw,  1.5rem);
  --t2:  clamp(1.5rem,    1.3rem  + 1vw,    2rem);
  --t3:  clamp(1.875rem,  1.5rem  + 1.8vw,  2.75rem);
  --t4:  clamp(2.25rem,   1.6rem  + 3.2vw,  4rem);
  --t5:  clamp(2.75rem,   1.8rem  + 5vw,    6rem);
  --hero:clamp(3rem,      15vw,             15rem);

  /* espaço */
  --s1:.5rem; --s2:1rem; --s3:1.5rem; --s4:2.5rem; --s5:4rem; --s6:6.5rem; --s7:10.5rem;

  /* grade */
  --wrap:1280px; --calha:1.5rem;
  --margem:clamp(1.25rem, 5vw, 5rem);
  --nav-h:4rem;

  --fio:1px solid var(--preto);
  --tr:160ms linear;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + 1rem);}
body{margin:0;overflow-x:clip;background:var(--branco);color:var(--preto);font-family:var(--corpo);font-size:var(--t0);line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;transition:color var(--tr),border-color var(--tr);}
a:hover,a:focus-visible{color:var(--terracota);}
:focus-visible{outline:2px solid var(--terracota);outline-offset:3px;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
ul{margin:0;padding:0;list-style:none;}
h1,h2,h3,p{margin:0;}

.display{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;line-height:1.02;}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--margem);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.skip{position:absolute;left:var(--margem);top:-3rem;background:var(--branco);padding:.5rem .75rem;border:var(--fio);z-index:100;}
.skip:focus{top:.5rem;}

/* ---------- NAV ---------- */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;background:var(--branco);border-bottom:1px solid transparent;transition:border-color var(--tr);}
.nav.rolou{border-bottom-color:var(--preto);}
.nav-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.marca{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:1.375rem;letter-spacing:.085em;border:0;}
.marca .u{color:var(--terracota);}
.menu{display:flex;gap:var(--s3);font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;}
.menu a{border:0;padding:.35rem 0;position:relative;}
.menu a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--terracota);transition:right var(--tr);}
.menu a:hover::after,.menu a[aria-current="true"]::after{right:0;}
.menu a[aria-current="true"]{color:var(--terracota);}
.hamb{display:none;width:2.5rem;height:2.5rem;position:relative;}
.hamb span{position:absolute;left:.5rem;right:.5rem;height:1px;background:var(--preto);transition:transform var(--tr),opacity var(--tr);}
.hamb span:nth-child(1){top:.9rem;} .hamb span:nth-child(2){top:1.25rem;} .hamb span:nth-child(3){top:1.6rem;}
.nav.aberto .hamb span:nth-child(1){transform:translateY(.35rem) rotate(45deg);}
.nav.aberto .hamb span:nth-child(2){opacity:0;}
.nav.aberto .hamb span:nth-child(3){transform:translateY(-.35rem) rotate(-45deg);}

/* ---------- SEÇÕES ---------- */
section{padding-block:var(--s6);}
.secao-cab{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);align-items:end;margin-bottom:var(--s5);padding-bottom:var(--s3);border-bottom:var(--fio);}
.secao-cab h2{grid-column:1/8;font-size:var(--t5);letter-spacing:.04em;text-transform:uppercase;line-height:.95;}
.secao-cab p{grid-column:8/13;max-width:38ch;font-size:var(--t0);}

/* ---------- ABERTURA ---------- */
.abertura{min-height:100svh;padding-top:calc(var(--nav-h) + var(--s5));padding-bottom:var(--s5);display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);align-content:end;}
.wordmark{grid-column:1/13;font-size:var(--hero);line-height:.88;letter-spacing:.085em;margin-right:-.085em;white-space:nowrap;}
.wordmark .u{color:var(--terracota);}
.wordmark span{display:inline-block;opacity:0;animation:surge 900ms cubic-bezier(.2,.6,.2,1) forwards;}
@keyframes surge{to{opacity:1;}}
.abertura-txt{grid-column:1/8;margin-top:var(--s4);}
.slogan{font-size:var(--t3);line-height:1.08;margin-bottom:var(--s2);}
.predicado{max-width:36ch;font-size:var(--t0);}
.abertura-nav{grid-column:9/13;align-self:end;display:flex;flex-direction:column;gap:.5rem;font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;margin-top:var(--s4);}
.abertura-nav a{border:0;width:max-content;border-bottom:1px solid var(--preto);padding-bottom:.15rem;}

/* ---------- POSIÇÃO ---------- */
.posicao{border-top:var(--fio);}
.posicao-in{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);}
.proposicao{grid-column:1/11;font-size:var(--t5);line-height:1.04;max-width:18ch;}
.posicao-nota{grid-column:1/9;margin-top:var(--s4);max-width:62ch;}

/* ---------- ELEMENTOS ---------- */
.elementos{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 clamp(1.25rem,3.5vw,3rem);padding:var(--s3) 0;border-bottom:var(--fio);margin-bottom:var(--s5);}
.elemento{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:var(--t4);line-height:1;letter-spacing:.06em;text-transform:uppercase;transition:color var(--tr);}
.elemento:hover,.elemento[aria-pressed="true"]{color:var(--terracota);}
.elemento-todos{font-family:var(--corpo);font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;margin-left:auto;}
.contagem{font-size:var(--t-1);letter-spacing:.04em;margin:calc(var(--s4) * -1) 0 var(--s4);}

/* ---------- PROJETOS ---------- */
.projetos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s6) var(--calha);}
.projeto{border-top:var(--fio);padding-top:var(--s3);display:flex;flex-direction:column;}
.projeto[hidden]{display:none;}
.projeto-imagem{aspect-ratio:4/5;width:62%;max-width:15rem;display:flex;align-items:center;justify-content:center;font-size:var(--t-1);margin-bottom:var(--s3);}
.projeto-imagem img{width:100%;height:100%;object-fit:cover;}
.projeto-nome{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 330;font-size:var(--t3);line-height:1;letter-spacing:.005em;max-width:12ch;text-wrap:balance;transition:color var(--tr);}
.projeto:hover .projeto-nome,.projeto:focus-within .projeto-nome{color:var(--terracota);}
.projeto:hover .quadro::before,.projeto:hover .quadro::after,.projeto:focus-within .quadro::before,.projeto:focus-within .quadro::after{border-color:var(--terracota);}
.projeto-meta{font-size:var(--t-1);margin:.75rem 0 .5rem;}
.projeto-ano{font-variant-numeric:tabular-nums;}
.projeto-tags{display:flex;gap:.75rem;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s2);}
.projeto-texto{font-size:var(--t0);max-width:40ch;}
.projeto-links{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin-top:var(--s2);font-size:.8125rem;letter-spacing:.04em;}

/* quadro de contorno interrompido, eco do arco do logotipo */
.quadro{position:relative;}
.quadro::before,.quadro::after{content:"";position:absolute;pointer-events:none;border-color:var(--preto);border-style:solid;transition:border-color var(--tr);}
.quadro::before{inset:0 14%;border-width:1px 0;}
.quadro::after{inset:11% 0 34%;border-width:0 1px;}

/* ---------- LISTAS EDITORIAIS (publicações, mídia) ---------- */
.abas{display:flex;flex-wrap:wrap;gap:var(--s3);margin-bottom:var(--s4);font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;}
.aba{padding:.4rem 0;border-bottom:1px solid transparent;transition:color var(--tr),border-color var(--tr);}
.aba:hover{color:var(--terracota);}
.aba[aria-selected="true"]{color:var(--terracota);border-bottom-color:var(--terracota);}
.painel[hidden]{display:none;}
.lista{border-top:var(--fio);}
.item{display:grid;grid-template-columns:minmax(7rem,9rem) minmax(0,1fr) 5.5rem;gap:.25rem var(--s3);align-items:baseline;padding:var(--s2) 0;border-bottom:var(--fio);}
.item-fonte{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;}
.item-titulo{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 350;font-size:var(--t1);line-height:1.15;border:0;}
a.item-titulo:hover{color:var(--terracota);}
.item-data{font-size:var(--t-1);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.item-fontes{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin-top:.4rem;font-size:.8125rem;letter-spacing:.04em;}
.mais{margin-top:var(--s3);font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--preto);}

.selo{display:inline-block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:var(--fio);padding:.1rem .45rem;margin-right:.5rem;vertical-align:middle;}
.projeto[data-tier="0"] .selo{background:var(--preto);color:var(--branco);border-color:var(--preto);}

/* ---------- ONDE, mapa ----------
   A terra é uma malha de pontos (sinais). As áreas de atuação são a mesma malha,
   em corpo maior e na cor do elemento. As cidades levam o arco aberto do logotipo. */
.mapa{width:100%;height:auto;display:block;}
.mapa-esfera{fill:none;stroke:var(--preto);stroke-width:.6;}
.mapa-area{transition:opacity var(--tr);}
.mapa-area:hover{opacity:.55;}
.mapa-cidade circle{fill:var(--terracota);}
.mapa-cidade path{fill:none;stroke:var(--terracota);stroke-width:1.1;stroke-linecap:round;transition:stroke-width var(--tr);}
.mapa-cidade:hover path{stroke-width:2;}
.mapa-legenda{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);margin-top:var(--s2);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;}
.mapa-legenda span{display:inline-flex;align-items:center;gap:.45rem;}
.mapa-legenda i{display:inline-block;width:1.2rem;height:.8rem;background:radial-gradient(var(--c) 1.1px,transparent 1.2px) 0 0/4px 4px;}
.mapa-legenda .lg-cidade{width:.85rem;height:.85rem;background:none;border:1.5px solid var(--terracota);border-radius:50%;border-bottom-right-radius:0;position:relative;}
.mapa-legenda .lg-cidade::after{content:"";position:absolute;inset:0;margin:auto;width:.3rem;height:.3rem;border-radius:50%;background:var(--terracota);}
.mapa-legenda .lg-pais{--c:var(--ar);} .mapa-legenda .lg-continente{--c:var(--terra);} .mapa-legenda .lg-regiao{--c:var(--fogo);} .mapa-legenda .lg-oceano{--c:var(--agua);}
.onde-lista{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3) var(--calha);margin-top:var(--s5);font-size:var(--t-1);}
.onde-lista h3{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:var(--fio);}
.onde-lista li{padding:.2rem 0;}
@media (max-width:760px){.onde-lista{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ---------- MÉTODO, as quatro práticas ---------- */
.metodo{border-top:var(--fio);}
.metodo-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--calha);}
.metodo-in > div{border-top:var(--fio);padding-top:var(--s2);}
.metodo h3{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:var(--t3);line-height:1;margin-bottom:var(--s2);}
.metodo p{font-size:var(--t-1);max-width:30ch;}
.metodo a{border:0;text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px;}
@media (max-width:760px){.metodo-in{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--calha);}}

.projeto-imagem img{opacity:0;animation:surge 400ms linear forwards;}


/* ---------- AGORA ---------- */
.agora{border-top:var(--fio);}
.agora-in{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);}
.agora-rotulo{grid-column:1/13;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:var(--s2);}
.agora h2{grid-column:1/9;font-size:var(--t5);line-height:.95;letter-spacing:.01em;margin-bottom:var(--s3);}
.agora-lede{grid-column:1/8;max-width:58ch;font-size:var(--t1);line-height:1.45;}
.agora-fatos{grid-column:9/13;display:flex;flex-direction:column;gap:var(--s2);border-left:var(--fio);padding-left:var(--s3);}
.agora-fatos li{display:flex;flex-direction:column;}
.agora-num{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:var(--t4);line-height:1;font-variant-numeric:tabular-nums;}
.agora-fatos li > span:last-child{font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;}
.agora-tags{grid-column:1/8;margin-top:var(--s3);}
.agora-acao{grid-column:1/8;display:flex;gap:var(--s3);font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;margin-top:var(--s2);}
.agora-acao a{border-bottom:1px solid var(--preto);}

/* práticas como cabeçalhos dentro da grade */
.pratica{grid-column:1/-1;display:flex;align-items:baseline;gap:var(--s3);padding-top:var(--s4);}
.pratica:first-child{padding-top:0;}
.pratica-titulo{font-size:var(--t3);letter-spacing:.06em;text-transform:uppercase;}
.pratica-frase{font-size:var(--t-1);max-width:34ch;}
.pratica[hidden]{display:none;}
.projeto-lugares{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:var(--s2);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;}
.projeto-lugares a{border:0;border-bottom:1px solid var(--preto);}
.ver-todos{margin-top:var(--s5);}
.projeto[data-extra="true"]{display:none;}
.projetos.completa .projeto[data-extra="true"]:not([hidden]){display:flex;}
.mapa-cidade,.mapa-area{cursor:pointer;outline:none;}
.mapa-cidade.ativo path{stroke-width:2.2;} .mapa-cidade.ativo circle{r:3.2;}
.mapa-area.ativo{opacity:.55;}
.mapa-legenda .lg-agora{--c:var(--preto);}
.lugar{border-bottom:1px solid var(--preto);transition:color var(--tr);}
.lugar:hover,.lugar.ativo{color:var(--terracota);border-color:var(--terracota);}
.lugar-projs{display:block;font-size:.8125rem;margin:.15rem 0 .5rem;}
.lugar-proj{border:0;} .lugar-proj+.lugar-proj::before{content:"";}
@media (max-width:760px){
  .agora-in{grid-template-columns:1fr;}
  .agora-rotulo,.agora h2,.agora-lede,.agora-fatos,.agora-tags,.agora-acao{grid-column:1;}
  .agora-fatos{flex-direction:row;border-left:0;padding-left:0;border-top:var(--fio);padding-top:var(--s2);gap:var(--s3);}
  .pratica{flex-direction:column;gap:.35rem;}
}




/* ---------- PALETA DO BRANDING, um elemento, uma cor ---------- */
:root{--ar:#7FB3CF;--agua:#3A6B8A;--fogo:#C04430;--terra:#A86B12;--verde:#3ECC7A;--abissal:#0E1C12;}
.elemento[data-el="ar"]:hover,.elemento[data-el="ar"][aria-pressed="true"]{color:var(--ar);}
.elemento[data-el="agua"]:hover,.elemento[data-el="agua"][aria-pressed="true"]{color:var(--agua);}
.elemento[data-el="fogo"]:hover,.elemento[data-el="fogo"][aria-pressed="true"]{color:var(--fogo);}
.elemento[data-el="terra"]:hover,.elemento[data-el="terra"][aria-pressed="true"]{color:var(--terra);}
.abertura-nav a[data-el="ar"]:hover{color:var(--ar);border-color:var(--ar);}
.abertura-nav a[data-el="agua"]:hover{color:var(--agua);border-color:var(--agua);}
.abertura-nav a[data-el="fogo"]:hover{color:var(--fogo);border-color:var(--fogo);}
.abertura-nav a[data-el="terra"]:hover{color:var(--terra);border-color:var(--terra);}

/* ---------- SELOS POR ORGANIZAÇÃO, mesma altura, mesma linha ---------- */
.selo{display:inline-flex;align-items:center;height:1.3rem;padding:0 .45rem;margin:0 .4rem .3rem 0;border:1px solid var(--preto);font-family:var(--corpo);font-size:.7rem;line-height:1;letter-spacing:.1em;text-transform:uppercase;vertical-align:middle;box-sizing:border-box;}
.selo[data-org="onu"]{background:var(--preto);color:var(--branco);}
.selo[data-org="instituto-ar"]{border-style:solid;}
.selo[data-org="icct"]{border-left-width:3px;}
.selo[data-org="universidade"]{border-style:dashed;}
.selo[data-org="nasa"]{border-style:dotted;}
.selo[data-org="futura"]{border-style:solid;font-family:var(--corpo);font-variation-settings:normal;letter-spacing:.14em;}
.selo[data-org="futura"] .u{color:var(--terracota);}
.projeto-meta{display:block;font-size:var(--t-1);margin:.5rem 0 var(--s2);}

/* ===== CORREÇÕES DE HIERARQUIA E PROPORÇÃO ===== */
.agora h2{font-size:var(--t4);}
.agora-fatos{align-self:start;}
.proposicao{font-size:var(--t4);max-width:18ch;}
.elementos{padding:var(--s2) 0;margin-bottom:var(--s4);}
.elemento{font-size:var(--t3);letter-spacing:.05em;}
.pratica{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--calha);align-items:baseline;padding:var(--s4) 0 0;border-top:0;}
.pratica:first-child{padding-top:0;}
.pratica-titulo{font-size:var(--t3);letter-spacing:0;text-transform:none;}
.pratica-frase{font-size:var(--t0);max-width:44ch;}
.projeto{border-top:3px solid var(--preto);padding-top:var(--s2);}
.projeto[data-cor="ar"]{border-top-color:var(--ar);} .projeto[data-cor="agua"]{border-top-color:var(--agua);} .projeto[data-cor="fogo"]{border-top-color:var(--fogo);} .projeto[data-cor="terra"]{border-top-color:var(--terra);}
.projeto[data-extra="true"]{display:flex;}
.projeto-imagem{width:58%;max-width:13rem;margin-bottom:var(--s2);}

.projeto-tags li[data-el="ar"] i{background:var(--ar);} .projeto-tags li[data-el="agua"] i{background:var(--agua);} .projeto-tags li[data-el="fogo"] i{background:var(--fogo);} .projeto-tags li[data-el="terra"] i{background:var(--terra);}
.secao-cab h2{font-size:var(--t4);}

/* ---------- QUEM ---------- */
.quem-in{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);align-items:start;}
.retrato{grid-column:1/5;aspect-ratio:4/5;width:100%;max-width:18rem;display:flex;align-items:center;justify-content:center;font-size:var(--t-1);}
.retrato img{width:100%;height:100%;object-fit:cover;}
.quem-txt{grid-column:5/12;}
.quem-txt h2{font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:var(--t4);line-height:.98;max-width:9ch;margin-bottom:var(--s3);}
.quem-txt p{max-width:58ch;margin-bottom:var(--s2);}
.trajetoria{margin-top:var(--s4);border-top:var(--fio);max-width:58ch;}
.trajetoria li{display:grid;grid-template-columns:7.5rem 1fr;gap:var(--s2);padding:.65rem 0;border-bottom:var(--fio);font-size:var(--t-1);}
.anos{font-variant-numeric:tabular-nums;white-space:nowrap;}
.registros{margin-top:var(--s3);display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;font-size:var(--t-1);}
.registros li:first-child{letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;}

/* ---------- CONTATO ---------- */
.contato{border-top:var(--fio);padding-block:var(--s6) var(--s4);}
.contato-in{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);}
.contato-email{grid-column:1/13;font-size:var(--t3);font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;font-size:var(--t4);line-height:1.05;width:max-content;max-width:100%;overflow-wrap:anywhere;}
.contato-links{grid-column:1/13;margin-top:var(--s3);display:flex;flex-direction:row;flex-wrap:wrap;gap:.5rem 1.75rem;font-size:var(--t-1);letter-spacing:.06em;text-transform:uppercase;}
.contato-links a{border:0;width:max-content;border-bottom:1px solid var(--preto);}
.assinatura{grid-column:1/13;margin-top:var(--s5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--s2);font-size:var(--t-1);}
.onde-lista > div:first-child ul{columns:2;column-gap:var(--calha);}
.onde-lista > div:first-child li{break-inside:avoid;}
.pratica{margin-top:var(--s2);}
.projeto-imagem{margin-top:var(--s2);}


/* ---------- FICHA: pergunta · método · resultado ---------- */
.ficha{margin:0;display:grid;gap:.6rem;}
.ficha div{display:grid;grid-template-columns:5.5rem 1fr;gap:.75rem;align-items:baseline;}
.ficha dt{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;}
.ficha dd{margin:0;font-size:var(--t-1);line-height:1.5;max-width:44ch;}
.ficha dd a{border-bottom:1px solid var(--preto);}
/* destaque: o projeto em curso ocupa a largura toda */
.projeto.destaque{grid-column:1/-1;border-top-width:3px;padding-top:var(--s3);margin-bottom:var(--s3);}
.destaque-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--calha);}
.destaque-rotulo{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:var(--s2);}
.projeto.destaque .projeto-nome{font-size:var(--t4);max-width:12ch;}
.ficha-larga dd{max-width:60ch;font-size:var(--t0);}
@media (max-width:760px){.destaque-in{grid-template-columns:1fr;} .ficha div{grid-template-columns:1fr;gap:.15rem;}}

.projeto-imagem:has(.ph),.retrato:has(.ph){display:none;}
.quem-in:has(.retrato .ph) .quem-txt{grid-column:1/10;}


/* ---------- COM QUEM, instituições ---------- */
.instituicoes{margin-top:var(--s5);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3) var(--calha);}
.instituicoes h3{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:var(--fio);}
.instituicoes li{padding:.3rem 0;font-size:var(--t-1);border-bottom:1px solid rgba(0,0,0,.12);}
.instituicoes li:last-child{border-bottom:0;}

/* ---------- CARDS COMO CONTÊINERES ---------- */
.projetos{gap:var(--calha);align-items:stretch;}
.pratica{padding:var(--s5) 0 var(--s2);}
.pratica:first-of-type{padding-top:var(--s3);}
.projeto{border:1px solid var(--preto);border-top-width:3px;padding:var(--s3);display:flex;flex-direction:column;gap:0;min-height:18rem;}
.projeto-nome{font-size:var(--t2);max-width:none;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.projeto-meta{margin:.6rem 0 var(--s2);}
.teaser{font-size:var(--t-1);line-height:1.5;max-width:38ch;margin:0;}
.abrir{margin-top:auto;padding-top:var(--s3);align-self:flex-start;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--preto);transition:color var(--tr),border-color var(--tr);}
.abrir:hover,.abrir:focus-visible{color:var(--terracota);border-color:var(--terracota);}
.projeto:hover{border-color:var(--preto);}
.projeto.destaque{min-height:0;padding:var(--s4);}
.teaser-larga{max-width:56ch;font-size:var(--t0);}
.destaque-acoes{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:baseline;margin-top:var(--s3);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;}
.destaque-acoes a{border-bottom:1px solid var(--preto);}
.destaque-acoes .abrir{margin-top:0;padding-top:0;}
.projeto.destaque .projeto-nome{font-size:var(--t4);-webkit-line-clamp:2;}
.projeto.destaque .destaque-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--calha);}
/* diálogo da ficha */
.ficha-dialog{border:1px solid var(--preto);padding:0;max-width:min(64rem,92vw);width:100%;background:var(--branco);color:var(--preto);}
.ficha-dialog::backdrop{background:rgba(255,255,255,.85);}
.fd-in{padding:var(--s4);position:relative;}
.fd-fechar{position:absolute;top:var(--s2);right:var(--s2);font-family:var(--display);font-size:var(--t2);line-height:1;padding:.25rem .5rem;}
.fd-fechar:hover{color:var(--terracota);}
.ficha-dialog .projeto-nome{font-size:var(--t3);max-width:20ch;-webkit-line-clamp:unset;display:block;}
.ficha-dialog .ficha{margin-top:var(--s3);}
.ficha-dialog .ficha dd{max-width:64ch;font-size:var(--t0);}
.ficha-dialog .projeto-links{margin-top:var(--s3);}
@media (max-width:760px){.projeto{min-height:0;} .fd-in{padding:var(--s3);}}


/* ---------- CONTÊINERES INVISÍVEIS, só o texto responde ---------- */
.projeto{border:0;padding:var(--s3) 0;border-top:1px solid transparent;}
.projeto[data-cor]{border-top-color:transparent;}
.projeto .projeto-nome,.projeto .teaser,.projeto .abrir{transition:color var(--tr),border-color var(--tr);}
.projeto[data-cor="ar"]:hover .projeto-nome,.projeto[data-cor="ar"]:focus-within .projeto-nome,.projeto[data-cor="ar"]:hover .abrir{color:var(--ar);border-color:var(--ar);}
.projeto[data-cor="agua"]:hover .projeto-nome,.projeto[data-cor="agua"]:focus-within .projeto-nome,.projeto[data-cor="agua"]:hover .abrir{color:var(--agua);border-color:var(--agua);}
.projeto[data-cor="fogo"]:hover .projeto-nome,.projeto[data-cor="fogo"]:focus-within .projeto-nome,.projeto[data-cor="fogo"]:hover .abrir{color:var(--fogo);border-color:var(--fogo);}
.projeto[data-cor="terra"]:hover .projeto-nome,.projeto[data-cor="terra"]:focus-within .projeto-nome,.projeto[data-cor="terra"]:hover .abrir{color:var(--terra);border-color:var(--terra);}
.projeto.destaque{padding:var(--s3) 0;}
.projetos{row-gap:var(--s4);}
.pratica{border-top:var(--fio);}

.projeto.ancora{grid-column:span 2;}
.projeto.ancora .projeto-nome{font-size:var(--t3);}
.projeto.ancora .teaser{max-width:56ch;font-size:var(--t0);}
.pratica-frase{display:none;}
.pratica{grid-template-columns:1fr;}
.pratica-titulo{max-width:none;}

/* ===== PASSE DE DESIGN: menos tamanhos, mais ar ===== */
:root{--t5:clamp(2.5rem,1.6rem + 4vw,4.5rem);}
.secao-cab{margin-bottom:var(--s5);padding-bottom:var(--s3);}
.secao-cab h2{font-size:var(--t5);letter-spacing:.03em;}
.secao-cab p{font-size:var(--t-1);max-width:40ch;line-height:1.6;}
.abertura{min-height:88svh;}
.slogan{font-size:var(--t3);}
.predicado{font-size:var(--t-1);letter-spacing:.02em;}
.proposicao{font-size:var(--t4);max-width:18ch;}
.posicao-nota{font-size:var(--t0);max-width:60ch;}
.elementos{padding:var(--s2) 0;margin-bottom:var(--s5);gap:0 clamp(1rem,3vw,2.5rem);}
.elemento{font-size:var(--t2);letter-spacing:.06em;}
.contagem{margin:calc(var(--s5) * -1 + var(--s2)) 0 var(--s4);}
.pratica{padding:var(--s5) 0 var(--s3);}
.pratica-titulo{font-size:var(--t2);letter-spacing:0;}
.projetos{gap:var(--s5) var(--calha);}
.projeto{padding:var(--s2) 0 0;}
.projeto-nome{font-size:var(--t2);line-height:1.05;}
.projeto.ancora .projeto-nome{font-size:var(--t3);}
.projeto-meta{font-size:.8125rem;margin:.5rem 0 var(--s2);}
.teaser{font-size:var(--t-1);line-height:1.55;max-width:40ch;}
.projeto.ancora .teaser{font-size:var(--t0);max-width:58ch;}
.abrir{font-size:.7rem;letter-spacing:.12em;}

.quem-txt h2{font-size:var(--t3);}

@media (max-width:760px){.fd-in{padding:var(--s3);}.secao-cab h2{font-size:var(--t4);}.projeto.destaque .destaque-in{grid-template-columns:1fr;}.projeto.destaque .projeto-nome{font-size:var(--t3);}}

/* ===== ORDEM DOS CARDS: mesmo esqueleto vertical em todos ===== */

.projeto:not(.destaque) .projeto-meta{min-height:calc(2 * 1.5em);line-height:1.5;margin:.6rem 0 var(--s2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ===== EDIÇÃO: escala de cinco degraus, reportagem e notas ===== */
:root{--d1:clamp(2.25rem,1.4rem + 3.4vw,3.5rem);--d2:clamp(1.75rem,1.2rem + 2.2vw,2.5rem);--d3:clamp(1.25rem,1.05rem + .8vw,1.5rem);}
section{padding-block:clamp(5rem,14vh,10rem);}

.pratica-titulo{letter-spacing:.14em;text-transform:uppercase;font-family:var(--corpo);font-weight:500;font-variation-settings:normal;font-size:.875rem;}
.pratica{padding:var(--s4) 0 var(--s3);}
.projeto.destaque .projeto-nome{font-size:var(--d1);max-width:14ch;}
.projeto.destaque .teaser-larga{font-size:var(--t1);max-width:48ch;}
/* reportagem: primeira de cada grupo, largura inteira, assimétrica */
.projeto.ancora{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,1fr);gap:var(--calha);align-items:start;padding:var(--s3) 0 var(--s4);border-top:var(--fio);}

.projeto.ancora .projeto-nome{grid-column:1/8;grid-row:1;font-size:var(--d2);min-height:0;-webkit-line-clamp:unset;display:block;max-width:18ch;line-height:1.04;}
.projeto.ancora .projeto-meta{grid-column:1/8;grid-row:2;min-height:0;display:block;margin:.5rem 0 0;}
.projeto.ancora .teaser{grid-column:8/13;grid-row:1;font-size:var(--t0);min-height:0;-webkit-line-clamp:unset;display:block;max-width:34ch;margin-top:.35rem;}
.projeto.ancora .abrir{grid-column:8/13;grid-row:2;align-self:start;margin-top:var(--s2);justify-self:start;}
/* notas: as demais, em três colunas estreitas */
.projeto:not(.destaque):not(.ancora){border-top:var(--fio);padding-top:var(--s2);}
.projeto:not(.destaque):not(.ancora) .projeto-nome{font-size:var(--d3);min-height:calc(3 * 1.12em);-webkit-line-clamp:3;line-height:1.12;}
.projeto:not(.destaque):not(.ancora) .projeto-meta{font-size:.75rem;}
.projeto:not(.destaque):not(.ancora) .teaser{font-size:.875rem;}
.projetos{gap:var(--s4) var(--s4);}
/* capa: sumário */
.abertura{grid-template-columns:repeat(12,1fr);}
.sumario{grid-column:10/13;align-self:end;display:flex;flex-direction:column;gap:.55rem;margin-top:var(--s4);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;border-top:var(--fio);padding-top:var(--s2);}
.sumario a{border:0;width:max-content;}
.sumario a:hover{color:var(--terracota);}
/* instituições em linha */

.instituicoes p{font-size:.875rem;line-height:1.6;margin:0 0 .75rem;}
.instituicoes p span{display:inline-block;margin-right:.6rem;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;}
/* revelação */
.js .revela{opacity:0;transition:opacity 500ms ease;}
.js .revela.visto{opacity:1;}

@media (max-width:760px){.sumario{grid-column:1;margin-top:var(--s3);} .projeto:not(.destaque):not(.ancora) .projeto-nome{min-height:0;-webkit-line-clamp:unset;display:block;}}


/* ===== IMAGENS: capa e reportagens com foto em cinco colunas ===== */
.projeto.destaque .projeto-imagem,.projeto.ancora .projeto-imagem{display:none;}
.projeto.destaque.com-imagem .destaque-in{grid-template-columns:repeat(12,1fr);}
.projeto.destaque.com-imagem .destaque-in > div:nth-of-type(1){grid-column:1/8;grid-row:1;}
.projeto.destaque.com-imagem .destaque-in > div:nth-of-type(2){grid-column:1/8;grid-row:2;}

.projeto.ancora.com-imagem .projeto-imagem{display:block;grid-column:8/13;grid-row:1/4;width:100%;max-width:none;aspect-ratio:4/5;margin:0;}

@media (max-width:1100px){.projeto.ancora.com-imagem .projeto-imagem,.projeto.destaque.com-imagem .projeto-imagem{grid-column:1/13;grid-row:auto;aspect-ratio:3/2;} .projeto.destaque.com-imagem .destaque-in > div{grid-column:1/13;}}


/* crédito da foto: aparece ao passar o mouse; sempre visível em telas de toque */
figure.projeto-imagem{position:relative;margin:0;overflow:hidden;}
figure.projeto-imagem figcaption{position:absolute;left:0;right:0;bottom:0;padding:.5rem .75rem;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--branco);background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0));opacity:0;transition:opacity var(--tr);}
figure.projeto-imagem:hover figcaption,figure.projeto-imagem:focus-within figcaption{opacity:1;}
@media (hover:none){figure.projeto-imagem figcaption{opacity:1;}}

.rede{display:inline-flex;align-items:center;gap:.5rem;border:0;}

@media (max-width:1100px){
  .projetos{grid-template-columns:repeat(2,minmax(0,1fr));}

}
@media (max-width:760px){

  .menu a{font-size:var(--t2);text-transform:none;letter-spacing:0;font-family:var(--display);font-weight:300;font-variation-settings:"opsz" 1200,"wdth" 87.5,"wght" 300;padding:.75rem 0;border-bottom:var(--fio);}
  .menu a::after{display:none;}
  .nav.aberto .menu{transform:none;}
  .hamb{display:block;}
  body.travado{overflow:hidden;}
  section{padding-block:var(--s5);}
  .abertura{grid-template-columns:1fr;align-content:center;}
  .abertura-txt,.abertura-nav,.wordmark{grid-column:1;}
  .abertura-nav{margin-top:var(--s3);}
  .posicao-in,.quem-in,.contato-in{grid-template-columns:1fr;}
  .onde-lista > div:first-child ul{columns:1;}
  .proposicao,.posicao-nota,.retrato,.quem-txt,.contato-email,.contato-links,.assinatura{grid-column:1;}
  .retrato{max-width:14rem;}
  .contato-email{font-size:var(--t2);width:auto;}
  .contato-links{flex-direction:column;gap:.5rem;}
  .projetos{grid-template-columns:1fr;gap:var(--s5);}
  .projeto-imagem{width:55%;}
  .item{grid-template-columns:1fr;gap:.2rem;}
  .item-data{text-align:left;}
  .elemento-todos{margin-left:0;width:100%;}
  .trajetoria li{grid-template-columns:1fr;gap:.1rem;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  html{scroll-behavior:auto;}
  .wordmark span{opacity:1;}
}
@media print{.nav,.hamb,.abas{display:none;} .painel[hidden]{display:block;} section{padding-block:2rem;}}
